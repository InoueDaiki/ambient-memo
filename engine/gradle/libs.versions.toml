[versions]
# agp と kotlin は apps/mobile が使う React Native の版に揃える。ずれると includeBuild で読めなくなる
agp = "9.2.1"
kotlin = "2.2.0"
compileSdk = "37"
minSdk = "24"
junit = "6.1.3"
detekt = "1.23.8"
commons-compress = "1.28.0"
coroutines = "1.10.2"
sqldelight = "2.4.1"
sherpa-onnx = "2.0.1"
# 0.17 以降は Kotlin 2.4 を要求する。React Native の Kotlin に揃えられる最後の版
litertlm = "0.16.1"
work = "2.11.2"

androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
serialization = "1.9.0"

[libraries]
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# Maven Central にないので GitHub Releases から取る。settings.gradle.kts を参照
sherpa-onnx-android = { module = "com.k2fsa:sherpa-onnx", version.ref = "sherpa-onnx" }
sherpa-onnx-jvm = { module = "com.k2fsa:sherpa-onnx-jvm", version.ref = "sherpa-onnx" }
sherpa-onnx-native-linux-x64 = { module = "com.k2fsa:sherpa-onnx-native-lib-linux-x64", version.ref = "sherpa-onnx" }
sherpa-onnx-native-osx-aarch64 = { module = "com.k2fsa:sherpa-onnx-native-lib-osx-aarch64", version.ref = "sherpa-onnx" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
