# LLM 評価セット。会話、人物、組織はすべて架空。個人の会話は含まない。
#
# split: dev はプロンプトの調整に使う。test はプロンプトを固定してから測る。
# traps: このセットで意図して混ぜた難所(集計にも使う)
#   asr      ASR の誤り(同音異義、脱落、フィラー)
#   label    話者ラベルの誤り
#   other    他人の作業(自分の ToDo ではない)
#   cancel   取り消された予定
#   done     完了済み
#   hypo     仮定、願望、冗談
#   none     ToDo がない
#   third    その場にいない第三者の名前
#
# 正解の書き方:
#   summary_facts / todos.match / qa.a は「グループの並び」。各グループのどれか1つの
#   部分文字列を含み、全グループが揃えば一致とする。比較の前に NFKC と空白の除去をする。
#   ASR の誤った表記も、正しい表記も、どちらでも一致するように書く。
#   due は YYYY-MM-DD。解釈に幅があるものは複数の候補を書く。null は期限なし。
#   speakers は話者ラベルごとの正解。null は名前が分からない話者。

